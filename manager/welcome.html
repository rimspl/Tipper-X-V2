<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DynaHaul-X — Tipper Division</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap');

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0a0e13;
  --bg-mid:#0f1419;
  --surface:#1e2530;
  --gold:#f5a623;
  --gold-dim:rgba(245,166,35,.25);
  --teal:#3ec9a5;
  --teal-dim:rgba(62,201,165,.15);
  --ink:#e2e8f0;
  --ink-soft:#94a3b8;
  --ink-faint:#64748b;
}

html,body{
  width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:var(--ink);
  font-family:'Work Sans',sans-serif;
}

/* ── CANVAS ── */
#particleCanvas{
  position:fixed;inset:0;z-index:0;
  pointer-events:none;
}

/* ── RADIAL PULSE BG ── */
.pulse-ring{
  position:fixed;border-radius:50%;
  border:1px solid var(--gold-dim);
  top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
  pointer-events:none;z-index:0;
  animation:pulseExpand 3s ease-out forwards;
}
.pulse-ring:nth-child(2){animation-delay:.6s;border-color:var(--teal-dim)}
.pulse-ring:nth-child(3){animation-delay:1.2s;border-color:var(--gold-dim)}
@keyframes pulseExpand{
  0%{transform:translate(-50%,-50%) scale(0);opacity:.7}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0}
}

/* ── GRID OVERLAY ── */
.grid-overlay{
  position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(62,201,165,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(62,201,165,.03) 1px,transparent 1px);
  background-size:60px 60px;
  animation:gridShift 20s linear infinite;
}
@keyframes gridShift{
  0%{background-position:0 0}
  100%{background-position:60px 60px}
}

/* ── MAIN CONTENT ── */
.splash{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:2rem;
}

/* ── LOGO MARK ── */
.logo-mark{
  width:100px;height:100px;
  border:2px solid var(--gold);
  border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  animation:logoAppear .8s cubic-bezier(.16,1,.3,1) forwards;
  opacity:0;transform:scale(.5) rotate(-10deg);
  box-shadow:0 0 50px var(--gold-dim),inset 0 0 25px var(--gold-dim);
}
.logo-mark::before{
  content:'';position:absolute;inset:-5px;
  border:1px solid rgba(245,166,35,.12);border-radius:26px;
}
.logo-mark svg{
  width:52px;height:52px;
  stroke:var(--gold);fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;
}
@keyframes logoAppear{
  0%{opacity:0;transform:scale(.5) rotate(-10deg)}
  60%{opacity:1;transform:scale(1.05) rotate(2deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}

/* ── WELCOME TO (small intro) ── */
.welcome-to{
  margin-top:2rem;
  font-family:'Work Sans',sans-serif;
  font-weight:300;font-size:clamp(.8rem,1.5vw,1rem);
  letter-spacing:.3em;text-transform:uppercase;
  color:var(--ink-soft);
  opacity:0;transform:translateY(10px);
  animation:fadeUp .6s ease-out 1s forwards;
}

/* ── BRAND NAME (main large title) ── */
.brand-name{
  margin-top:.4rem;
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
  font-size:clamp(3rem,9vw,7rem);
  line-height:1;
  letter-spacing:.04em;
  opacity:0;
  background:linear-gradient(135deg,var(--gold) 0%,#ffd700 40%,var(--gold) 60%,#c8890a 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 0 30px var(--gold-dim));
  animation:brandReveal 1s cubic-bezier(.16,1,.3,1) 1.2s forwards;
  transform:translateY(30px) scale(.95);
}
@keyframes brandReveal{
  0%{opacity:0;transform:translateY(30px) scale(.95)}
  60%{opacity:1;transform:translateY(-4px) scale(1.02)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

/* ── DIVISION (secondary line) ── */
.division-line{
  margin-top:.2rem;
  font-family:'Rajdhani',sans-serif;
  font-weight:600;
  font-size:clamp(1.1rem,3vw,2rem);
  letter-spacing:.5em;text-transform:uppercase;
  color:var(--teal);
  opacity:0;transform:translateY(15px);
  animation:fadeUp .7s ease-out 1.8s forwards;
  text-shadow:0 0 20px var(--teal-dim);
}

/* ── DIVIDER LINE ── */
.divider{
  width:0;height:2px;margin-top:1.5rem;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  animation:dividerGrow 1s ease-out 2.4s forwards;
  border-radius:2px;
}
@keyframes dividerGrow{
  0%{width:0;opacity:0}
  100%{width:min(380px,70vw);opacity:1}
}

/* ── TAGLINE ── */
.tagline{
  margin-top:1.25rem;
  font-size:clamp(.85rem,2vw,1.05rem);
  font-weight:300;color:var(--ink-soft);
  letter-spacing:.04em;
  opacity:0;transform:translateY(12px);
  animation:fadeUp .6s ease-out 2.7s forwards;
  max-width:520px;line-height:1.6;
}
@keyframes fadeUp{
  0%{opacity:0;transform:translateY(12px)}
  100%{opacity:1;transform:translateY(0)}
}

/* ── TAGLINE CHIPS ── */
.chips{
  display:flex;gap:.6rem;margin-top:2rem;
  flex-wrap:wrap;justify-content:center;
  opacity:0;
  animation:fadeUp .6s ease-out 3.1s forwards;
}
.chip{
  padding:.4rem 1rem;
  border:1px solid var(--ink-faint);
  border-radius:100px;
  font-size:.7rem;font-weight:500;
  letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);
  transition:all .3s;
}
.chip:nth-child(1){border-color:var(--gold);color:var(--gold)}
.chip:nth-child(2){border-color:var(--teal);color:var(--teal)}
.chip:nth-child(3){border-color:var(--ink-faint);color:var(--ink-faint)}

/* ── LOADING BAR ── */
.load-bar-wrap{
  position:fixed;bottom:0;left:0;right:0;
  height:3px;z-index:20;
  background:rgba(255,255,255,.03);
}
.load-bar{
  height:100%;width:0;
  background:linear-gradient(90deg,var(--teal),var(--gold));
  border-radius:0 2px 2px 0;
  animation:loadFill 4.5s cubic-bezier(.4,0,.2,1) 1s forwards;
  box-shadow:0 0 12px var(--gold-dim);
}
@keyframes loadFill{
  0%{width:0}
  70%{width:85%}
  100%{width:100%}
}

/* ── SKIP BUTTON ── */
.skip-btn{
  position:fixed;bottom:2rem;right:2rem;z-index:30;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  color:var(--ink-faint);
  padding:.45rem 1.2rem;border-radius:100px;
  font-size:.75rem;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;
  transition:all .3s;
  opacity:0;
  animation:fadeUp .5s ease-out 3.5s forwards;
}
.skip-btn:hover{
  background:rgba(255,255,255,.1);
  border-color:var(--gold);color:var(--gold);
}

/* ── CORNER DECORATIONS ── */
.corner{
  position:fixed;z-index:5;
  width:60px;height:60px;
  border-style:solid;border-color:var(--gold-dim);
  opacity:0;
  animation:fadeUp .5s ease-out .8s forwards;
}
.corner-tl{top:1.5rem;left:1.5rem;border-width:2px 0 0 2px;border-radius:4px 0 0 0}
.corner-tr{top:1.5rem;right:1.5rem;border-width:2px 2px 0 0;border-radius:0 4px 0 0}
.corner-bl{bottom:1.5rem;left:1.5rem;border-width:0 0 2px 2px;border-radius:0 0 0 4px}
.corner-br{bottom:1.5rem;right:1.5rem;border-width:0 2px 2px 0;border-radius:0 0 4px 0}

/* ── STATUS DOT ── */
.status-dot{
  position:fixed;top:2rem;left:50%;transform:translateX(-50%);
  z-index:20;display:flex;align-items:center;gap:.5rem;
  opacity:0;animation:fadeUp .5s ease-out 3.2s forwards;
}
.status-dot::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--teal);
  box-shadow:0 0 8px var(--teal);
  animation:blink 1.5s ease-in-out infinite;
}
.status-dot span{
  font-size:.65rem;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint);
}
@keyframes blink{
  0%,100%{opacity:1}50%{opacity:.3}
}

/* ── EXIT ANIMATION ── */
.splash.exit{
  animation:splashExit 1.2s cubic-bezier(.7,0,.3,1) forwards;
}
@keyframes splashExit{
  0%{opacity:1;filter:blur(0)}
  60%{opacity:1;filter:blur(2px)}
  100%{opacity:0;filter:blur(12px);transform:scale(1.05)}
}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .logo-mark{width:80px;height:80px;border-radius:18px}
  .logo-mark svg{width:42px;height:42px}
  .brand-name{font-size:clamp(2.5rem,12vw,4rem)}
  .division-line{letter-spacing:.3em;font-size:clamp(.9rem,4vw,1.4rem)}
  .corner{width:40px;height:40px}
  .corner-tl,.corner-tr{top:1rem}
  .corner-bl,.corner-br{bottom:1rem}
  .corner-tl,.corner-bl{left:1rem}
  .corner-tr,.corner-br{right:1rem}
  .skip-btn{bottom:1.2rem;right:1.2rem}
}
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="grid-overlay"></div>

<div class="pulse-ring"></div>
<div class="pulse-ring"></div>
<div class="pulse-ring"></div>

<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div class="status-dot"><span>System Online</span></div>

<div class="splash" id="splash">

  <div class="logo-mark">
    <svg viewBox="0 0 48 48">
      <path d="M8 38V14a2 2 0 012-2h16a2 2 0 012 2v24"/>
      <path d="M28 22h6a2 2 0 012 2v6a2 2 0 002 2v0a2 2 0 002-2V18l-4-4"/>
      <path d="M8 38h20"/>
      <rect x="12" y="18" width="10" height="6" rx="1"/>
      <line x1="12" y1="28" x2="22" y2="28"/>
      <line x1="12" y1="32" x2="18" y2="32"/>
    </svg>
  </div>

  <p class="welcome-to">Welcome to</p>

  <h1 class="brand-name">DYNAHAUL-X</h1>

  <p class="division-line">TIPPER DIVISION</p>

  <div class="divider"></div>

  <p class="tagline">
    Intelligent fleet analytics engineered for India's mining &amp; tipper operations. 
    Real-time insights. Zero guesswork.
  </p>

  <div class="chips">
    <span class="chip">Tyre Intelligence</span>
    <span class="chip">Fleet Analytics</span>
    <span class="chip">Cost Optimisation</span>
  </div>

</div>

<div class="load-bar-wrap"><div class="load-bar"></div></div>

<button class="skip-btn" id="skipBtn">Enter &rarr;</button>

<script>
(function(){
  const REDIRECT_DELAY = 5500;
  const splash = document.getElementById('splash');
  const skipBtn = document.getElementById('skipBtn');

  function getDest(){
    return './index.html?preview=onboarding';
  }

  let redirected = false;
  function goNext(){
    if(redirected) return;
    redirected = true;
    sessionStorage.setItem('welcome_shown','1');
    splash.classList.add('exit');
    setTimeout(()=>{ window.location.replace(getDest()); }, 1100);
  }

  history.replaceState(null,'',window.location.href);
  history.pushState(null,'',window.location.href);
  window.addEventListener('popstate',()=>{ window.location.replace(getDest()); });

  skipBtn.addEventListener('click', goNext);
  splash.addEventListener('click', goNext);
  document.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' ') goNext(); });

  /* ── PARTICLE SYSTEM ── */
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [], mouse = {x:-9999,y:-9999};

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const PARTICLE_COUNT = Math.min(80, Math.floor(W * H / 15000));
  const GOLD = [245,166,35];
  const TEAL = [62,201,165];

  class Particle {
    constructor(){this.reset(true)}
    reset(init){
      this.x = Math.random() * W;
      this.y = init ? Math.random() * H : H + 10;
      this.vx = (Math.random() - .5) * .3;
      this.vy = -(Math.random() * .6 + .15);
      this.r = Math.random() * 1.8 + .4;
      this.life = 1;
      this.decay = Math.random() * .002 + .001;
      const pick = Math.random();
      this.color = pick < .6 ? GOLD : pick < .85 ? TEAL : [226,232,240];
    }
    update(){
      this.x += this.vx;
      this.y += this.vy;
      this.vy -= .002;
      this.vx += (mouse.x - this.x) * .00001;
      this.life -= this.decay;
      if(this.life <= 0 || this.y < -10) this.reset(false);
    }
    draw(){
      const [r,g,b] = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${r},${g},${b},${this.life * .6})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * 3, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${r},${g},${b},${this.life * .08})`;
      ctx.fill();
    }
  }

  for(let i=0;i<PARTICLE_COUNT;i++) particles.push(new Particle());

  /* ── CONNECTING LINES ── */
  function drawLines(){
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < 120){
          const alpha = (1 - dist/120) * .08 * Math.min(particles[i].life, particles[j].life);
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(245,166,35,${alpha})`;
          ctx.lineWidth = .5;
          ctx.stroke();
        }
      }
    }
  }

  function animate(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p=>{p.update();p.draw()});
    drawLines();
    requestAnimationFrame(animate);
  }
  animate();

  document.addEventListener('mousemove',(e)=>{mouse.x=e.clientX;mouse.y=e.clientY});
})();
</script>
</body>
</html>
